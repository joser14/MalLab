<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MalLab</title>
<style>
/* MalLab design system: electric blue + violet, crisp edges, offset "riso" shadows, mono data labels.
   Fonts (SIL OFL, bundled in ui/fonts): Space Grotesk (headings), Inter (text), JetBrains Mono (data). */
@font-face { font-family: "Space Grotesk"; src: url(/fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "Inter"; src: url(/fonts/inter.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/jetbrains-mono.woff2) format("woff2"); font-weight: 100 800; font-display: swap; }

:root {
  --bg: #f3f4fb; --dots: rgba(60, 50, 160, .10);
  --surface: #ffffff; --raised: #f6f6fd; --hover: #eef0fc;
  --line: #e2e3f2; --line2: #cfd1e8; --ink: #15132e;
  --text: #15132e; --text2: #3e3b60; --muted: #6a6791; --faint: #a19fc2;
  --blue: #2f5bff; --violet: #7a3cf0;
  --grad: linear-gradient(115deg, #2f5bff 0%, #5a49ff 50%, #8a3cf0 100%);
  --accent: #4a49f5; --accent-bg: #3d55ff; --accent-soft: rgba(74, 73, 245, .10);
  --shadow: #cfc6ff; --shadow-strong: #15132e;
  --red: #dc2f4a; --red-bg: #e3344f; --amber: #b8710a; --green: #0f9468;
  --code: #f6f5fe;
  --head: "Space Grotesk", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0a17; --dots: rgba(150, 140, 255, .07);
    --surface: #131228; --raised: #19183a; --hover: #211f49;
    --line: #252348; --line2: #36336a; --ink: #e9e7ff;
    --text: #edebff; --text2: #c4c1ea; --muted: #8f8cba; --faint: #5d5a88;
    --accent: #8f95ff; --accent-bg: #4a63ff; --accent-soft: rgba(143, 149, 255, .14);
    --shadow: #2a1f73; --shadow-strong: #000;
    --red: #ff6b80; --red-bg: #e3344f; --amber: #f2b54a; --green: #3fdc9c; --code: #0f0e22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0a17; --dots: rgba(150, 140, 255, .07);
  --surface: #131228; --raised: #19183a; --hover: #211f49;
  --line: #252348; --line2: #36336a; --ink: #e9e7ff;
  --text: #edebff; --text2: #c4c1ea; --muted: #8f8cba; --faint: #5d5a88;
  --accent: #8f95ff; --accent-bg: #4a63ff; --accent-soft: rgba(143, 149, 255, .14);
  --shadow: #2a1f73; --shadow-strong: #000;
  --red: #ff6b80; --red-bg: #e3344f; --amber: #f2b54a; --green: #3fdc9c; --code: #0f0e22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg) radial-gradient(var(--dots) 1px, transparent 1.2px) 0 0 / 22px 22px fixed; color: var(--text);
       font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; font-feature-settings: "cv11", "ss01"; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
::selection { background: color-mix(in srgb, var(--violet) 28%, transparent); }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: var(--r-sm); }
.hidden { display: none !important; }

/* buttons & inputs */
button, .btn { font: 600 13px/1 var(--head); letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px; border-radius: var(--r-sm); border: 1.5px solid var(--ink); background: var(--surface); color: var(--text);
  cursor: pointer; white-space: nowrap; transition: transform .1s, box-shadow .1s, background .12s; text-decoration: none !important; }
button:hover, .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--shadow); }
button:active, .btn:active { transform: none; box-shadow: none; }
button.primary, .btn.primary { background: var(--grad); color: #fff; }
button.primary:hover, .btn.primary:hover { box-shadow: 3px 3px 0 var(--shadow-strong); }
button.danger { background: var(--red-bg); color: #fff; }
button.danger:hover { box-shadow: 3px 3px 0 var(--shadow-strong); }
button.ghost { background: transparent; border-color: transparent; color: var(--text2); }
button.ghost:hover { background: var(--hover); color: var(--text); box-shadow: none; transform: none; }
button.ghost.red { color: var(--red); }
button.sm, .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
button.lg { height: 44px; padding: 0 24px; font-size: 15px; border-radius: var(--r); }
button:disabled, button:disabled:hover { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
input, select, textarea { font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface); border: 1.5px solid var(--line2);
  border-radius: var(--r-sm); padding: 0 11px; height: 34px; min-width: 0; transition: border-color .12s, box-shadow .12s; }
textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.55; }
select { padding-right: 6px; }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--violet); box-shadow: 3px 3px 0 var(--shadow); }
input.mono-in { font-family: var(--mono); font-size: 12.5px; }

.switch { position: relative; display: inline-block; width: 40px; height: 23px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--raised); border: 1.5px solid var(--ink); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink); transition: transform .15s, background .15s; }
.switch input:checked + span { background: var(--grad); }
.switch input:checked + span::after { transform: translateX(17px); background: #fff; }
.switch input:focus-visible + span { outline: 2px solid var(--violet); outline-offset: 2px; }
.switch input:disabled { cursor: not-allowed; }
.switch input:disabled + span { opacity: .45; }

.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
.seg button { height: 27px; border: none; background: transparent; color: var(--muted); padding: 0 11px; font-size: 12px; border-radius: 5px; }
.seg button:hover { color: var(--text); background: var(--hover); transform: none; box-shadow: none; }
.seg button.on { background: var(--ink); color: var(--surface); }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1.5px solid var(--line2); }
.top::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--grad); }
.top-in { max-width: 1180px; margin: 0 auto; height: 62px; padding: 3px 24px 0; display: flex; align-items: center; gap: 26px; }
.logo { display: flex; align-items: center; gap: 10px; font: 700 18px var(--head); letter-spacing: -.02em; color: var(--text); text-decoration: none !important; }
.logo i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--grad); box-shadow: 2px 2px 0 var(--shadow-strong); }
.logo i svg { width: 16px; height: 16px; }
.logo em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; gap: 2px; }
.nav a { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px 12px; border-radius: 6px; text-decoration: none !important; position: relative; }
.nav a:hover { color: var(--text); background: var(--hover); }
.nav a.on { color: var(--text); }
.nav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 3px; border-radius: 3px; background: var(--grad); }
.status { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.stat { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 6px; font: 500 11.5px var(--mono); color: var(--text2);
  border: 1.5px solid var(--line2); background: var(--surface); text-decoration: none !important; white-space: nowrap; }
.stat:hover { border-color: var(--violet); color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.dot.bad { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 22%, transparent); }
.dot.warn { background: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 22%, transparent); }
.dot.busy { background: var(--violet); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#theme { width: 30px; padding: 0; font-size: 14px; }

/* layout */
main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 90px; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head > :first-child { flex: 1; min-width: 240px; }
h1 { font: 700 32px/1.15 var(--head); letter-spacing: -.025em; }
.page-head h1::before { content: "// "; font: 500 .55em var(--mono); vertical-align: .35em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.crumbs { display: flex; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--faint); margin-bottom: 12px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); } .crumbs b { color: var(--text2); font-weight: 500; }
.section-title { display: flex; align-items: baseline; gap: 12px; font: 600 16px var(--head); margin: 38px 0 12px; }
.section-title a { font: 500 12px var(--mono); margin-left: auto; }
.card { background: var(--surface); border: 1.5px solid var(--line2); border-radius: var(--r); padding: 20px; box-shadow: 5px 5px 0 var(--shadow); }
.stack > * + * { margin-top: 18px; }
.card.flush { padding: 0; overflow: hidden; }
/* a card's leading h3 becomes its panel header, with a status light */
.card h3 { display: flex; align-items: center; gap: 9px; font: 600 11.5px var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
.card > h3:first-child { margin: -20px -20px 16px; padding: 11px 18px; border-bottom: 1.5px solid var(--line); background: var(--raised); border-radius: var(--r) var(--r) 0 0; }
.card h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--grad); flex: none; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.end { justify-content: flex-end; }
.small { font-size: 12.5px; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.break { word-break: break-all; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 22px; align-items: start; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* drop zone + options */
.drop { border: 2px dashed var(--line2); border-radius: 14px; padding: 46px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  background: linear-gradient(var(--surface), var(--surface)) padding-box; }
.drop:hover, .drop.hot { border-color: var(--violet); background: var(--accent-soft); }
.drop .ic { width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--grad); color: #fff; box-shadow: 3px 3px 0 var(--shadow-strong); }
.drop .ic svg { width: 21px; height: 21px; }
.drop .t { font: 600 16px var(--head); }
.drop .file { margin-top: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text2); }
.drop.has { border-style: solid; border-color: var(--violet); }
.drop.sm { padding: 22px 14px; }
.drop.sm .t { font-size: 14px; }
.opts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.5px; background: var(--line2); border: 1.5px solid var(--line2); border-radius: var(--r); overflow: hidden; margin-top: 18px; }
.opt { background: var(--surface); padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.opt-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 600 13.5px var(--head); }
.opt p { font-size: 12px; color: var(--muted); line-height: 1.45; }
.opt input.pw { height: 30px; font-family: var(--mono); font-size: 12px; }
.runbar { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
.runbar .small { flex: 1; min-width: 200px; }

/* notices */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: var(--r); border: 1.5px solid var(--line2); border-left: 4px solid var(--violet);
  background: color-mix(in srgb, var(--violet) 6%, var(--surface)); margin-bottom: 20px; font-size: 13.5px; }
.notice .nic { width: 20px; height: 20px; border-radius: 6px; flex: none; display: grid; place-items: center; font: 800 12px var(--mono); color: #fff; background: var(--grad); margin-top: 1px; }
.notice details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 2px; }
.notice details p { margin-top: 6px; color: var(--text2); font-family: var(--mono); font-size: 12px; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .09em; padding: 11px 16px; border-bottom: 1.5px solid var(--line2); background: var(--raised); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tr.link { cursor: pointer; transition: background .1s; }
tr.link:hover { background: var(--hover); box-shadow: inset 3px 0 0 var(--violet); }
td.chev { color: var(--faint); text-align: right; width: 32px; font-family: var(--mono); }
tr.link:hover td.chev { color: var(--violet); }
.tbl { border: 1.5px solid var(--line2); border-radius: var(--r-sm); overflow: auto; }
.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty b { display: block; color: var(--text); font: 600 16px var(--head); margin-bottom: 4px; }
.empty .btn, .empty button { margin-top: 14px; }

/* risk & badges */
.risk { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 23px; padding: 0 8px; border-radius: 5px; font: 700 12px var(--mono); font-variant-numeric: tabular-nums; border: 1.5px solid currentColor; }
.risk.lo { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
.risk.mid { color: var(--amber); background: color-mix(in srgb, var(--amber) 11%, transparent); }
.risk.hi { color: var(--red); background: color-mix(in srgb, var(--red) 11%, transparent); }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 5px; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .05em;
  background: var(--raised); color: var(--text2); border: 1px solid var(--line2); }
.badge.hi, .badge.malicious, .badge.high { color: var(--red); background: color-mix(in srgb, var(--red) 11%, transparent); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.badge.mid, .badge.suspicious, .badge.medium { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.badge.lo, .badge.clean, .badge.ok { color: var(--green); background: color-mix(in srgb, var(--green) 11%, transparent); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.badge.low { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 5px; background: var(--raised); border: 1px solid var(--line2); color: var(--text2); }
a.chip:hover { border-color: var(--violet); color: var(--text); text-decoration: none; }
.chip.attck { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }

/* sample page */
.shead { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.shead .info { flex: 1; min-width: 240px; }
.shead h1 { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -.02em; word-break: break-all; margin-top: 6px; }
.gauge { position: relative; flex: none; background: var(--surface); border-radius: 50%; box-shadow: 4px 4px 0 var(--shadow); }
.gauge svg { transform: rotate(-90deg); display: block; }
.gauge .n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 1em var(--head); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line2); margin: 22px 0 26px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 11px 14px; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: -1.5px;
  border-bottom: 3px solid transparent; white-space: nowrap; text-decoration: none !important; }
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--text); border-image: var(--grad) 1; border-bottom-width: 3px; border-bottom-style: solid; }
.tabs .n { font-size: 10.5px; color: #fff; background: var(--grad); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 16px; font-size: 13.5px; align-items: baseline; }
.kv .k { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.copyable { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.copyable .mono { word-break: break-all; }
.copy { height: auto; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 4px; background: none; font: 500 10.5px var(--mono); color: var(--muted); }
.copy:hover { color: var(--violet); border-color: var(--violet); transform: none; box-shadow: none; }
.reasons { display: grid; gap: 8px; }
.reasons div { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; }
.reasons div::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--grad); flex: none; transform: translateY(-2px); }
.det { padding: 15px 18px; border-top: 1px solid var(--line); }
.det .row b { font: 600 14px var(--head); }
.det p { font-size: 13px; color: var(--muted); margin-top: 2px; }
pre { margin: 0; background: var(--code); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--text2); white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
.sect { border-top: 1px solid var(--line); }
.card.flush > .sect:first-child { border-top: none; }
.sect > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 18px; font: 600 14px var(--head); user-select: none; }
.sect > summary::-webkit-details-marker { display: none; }
.sect > summary::after { content: "+"; margin-left: auto; font: 500 16px var(--mono); color: var(--muted); }
.sect[open] > summary::after { content: "–"; color: var(--violet); }
.sect > summary:hover { background: var(--hover); }
.sect > div { padding: 0 18px 18px; display: grid; gap: 10px; }
.sublabel { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 8px; }
.none { color: var(--faint); font-size: 13px; }
.ptree, .ptree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1.5px dashed var(--line2); }
.ptree { padding-left: 4px; border: none; }
.ptree li { padding: 4px 0; }
.shot { max-width: 100%; border-radius: var(--r-sm); border: 1.5px solid var(--line2); box-shadow: 4px 4px 0 var(--shadow); }
.log { background: var(--code); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 10px 12px; font: 12px/1.7 var(--mono); color: var(--text2); max-height: 220px; overflow: auto; margin-top: 12px; }
.log div { display: flex; gap: 12px; } .log .ts { color: var(--faint); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line2); border-top-color: var(--violet); border-right-color: var(--blue); border-radius: 50%; animation: sp .7s linear infinite; flex: none; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* intel */
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.prov { border: 1.5px solid var(--line2); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; align-content: start; background: var(--surface); box-shadow: 4px 4px 0 var(--shadow); }
.prov.off { opacity: .55; box-shadow: none; }

#yr-text { border: none; border-radius: 0; background: transparent; box-shadow: none; font: 12.5px/1.65 var(--mono); padding: 14px; min-height: 460px; width: 100%; white-space: pre; overflow: auto; tab-size: 4; resize: none; }

.toggle-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); box-shadow: 4px 4px 0 var(--shadow); }

/* toasts + dialog */

.toast { background: var(--surface); color: var(--text); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 11px 15px; font-size: 13.5px;
  box-shadow: 4px 4px 0 var(--shadow); max-width: 390px; animation: fade .2s ease; display: flex; gap: 10px; align-items: baseline; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--green); flex: none; transform: translateY(-1px); }
.toast.err::before { background: var(--red); }
dialog { border: 1.5px solid var(--ink); border-radius: 14px; background: var(--grad) top / 100% 5px no-repeat, var(--surface); color: var(--text); padding: 0;
  width: min(470px, calc(100vw - 32px)); box-shadow: 8px 8px 0 var(--shadow); }
dialog::backdrop { background: rgba(11, 10, 30, .55); backdrop-filter: blur(3px); }

/* ATT&CK matrix, timeline, groups */
.matrix { display: flex; gap: 10px; overflow-x: auto; padding: 2px 6px 8px 2px; }
.mcol { min-width: 152px; flex: 1; display: grid; gap: 7px; align-content: start; }
.mh { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text2); padding-bottom: 6px; border-bottom: 2px solid; border-image: var(--grad) 1; }
.mt { display: block; padding: 8px 10px; border: 1.5px solid var(--line2); border-left-width: 4px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--text); text-decoration: none; background: var(--surface); transition: transform .1s, box-shadow .1s; }

.mt.high { border-left-color: var(--red); } .mt.medium { border-left-color: var(--amber); } .mt.low { border-left-color: var(--blue); } .mt.info { border-left-color: var(--violet); }
.tl { display: grid; gap: 0; }

  .opts, .two { grid-template-columns: 1fr; }

<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg></i><span>Mal<em>Lab</em></span></a>
  <nav class="nav">
    <a href="#/" data-nav="analyze">Analyze</a>
    <a href="#/cases" data-nav="cases">Cases</a>
    <a href="#/actors" data-nav="actors">Groups</a>
    <a href="#/rules" data-nav="rules">Rules</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="status">
    <button class="sm" id="open-sb" title="Open a hardened Windows Sandbox: networking off, no GPU, clipboard/audio/video/printer disconnected">Open Sandbox</button>
    <a class="stat" href="#/settings" id="st-sb" title="Windows Sandbox"><span class="dot"></span><span class="lbl">Sandbox</span></a>
    <a class="stat" href="#/settings" id="st-def" title="Microsoft Defender"><span class="dot"></span><span class="lbl">Defender</span></a>
    <a class="stat" href="#/settings" id="st-ti" title="Threat-intel sources"><span class="dot"></span><span class="lbl">Intel</span></a>
    <button class="sm ghost" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button>
  </div>
</div></header>

<main id="main"></main>

<dialog id="dlg"><div class="dbody"><h2 id="dlg-title"></h2><div class="dtext" id="dlg-body"></div></div>
  <div class="dfoot"><button id="dlg-cancel">Cancel</button><button id="dlg-ok" class="primary">OK</button></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
// ============================================================ helpers
const $ = (id) => document.getElementById(id);
const main = $("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p, body) => fetch(p, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
  .then(async (r) => { try { return await r.json(); } catch { return { error: `Server error (${r.status})` }; } })
  .catch((e) => ({ error: "Can't reach the lab service: " + e.message }));
const fmtDate = (t) => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
const fmtSize = (n) => n == null ? "" : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`;
const riskClass = (r) => r >= 60 ? "hi" : r >= 25 ? "mid" : "lo";
const riskWord = (r) => r >= 60 ? "Malicious" : r >= 25 ? "Suspicious" : "Low risk";
const riskBadge = (r) => `<span class="risk ${riskClass(r || 0)}">${r || 0}</span>`;
const cap = (s) => s ? String(s)[0].toUpperCase() + String(s).slice(1) : "";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const now = () => new Date().toLocaleTimeString([], { hour12: false });
const store = { get(k, d) { try { const v = localStorage.getItem("mallab." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("mallab." + k, JSON.stringify(v)); } catch {} } };
const ICON_UP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>`;

function toast(text, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = text;
  $("toasts").appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800);
}
function ask({ title, body, ok = "Confirm", danger = false, cancel = "Cancel" }) {
  return new Promise((resolve) => {
    const d = $("dlg");
    $("dlg-title").textContent = title; $("dlg-body").innerHTML = body;
    $("dlg-ok").textContent = ok; $("dlg-ok").className = danger ? "danger" : "primary";
    $("dlg-cancel").textContent = cancel;
    const done = (v) => { d.close(); resolve(v); };
    $("dlg-ok").onclick = () => done(true); $("dlg-cancel").onclick = () => done(false);
    d.oncancel = (e) => { e.preventDefault(); done(false); };
    d.showModal(); $("dlg-cancel").focus();
  });
}
const copyBtn = (text) => `<button class="copy" data-copy="${esc(text)}">copy</button>`;
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); } catch { toast("Clipboard not available", true); }
});
const sw = (id, on, extra = "") => `<label class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""} ${extra}><span></span></label>`;
const seg = (id, opts, val) => `<div class="seg" id="${id}" role="radiogroup">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${v === val}" data-v="${v}" class="${v === val ? "on" : ""}">${l}</button>`).join("")}</div>`;
function wireSeg(id, onChange) {
  $(id).querySelectorAll("button").forEach((b) => b.onclick = () => {
    $(id).querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    onChange(b.dataset.v);
  });
}
function setupDrop(zone, input, onFiles) {
  zone.onclick = () => input.click();
  zone.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  zone.ondragover = (e) => { e.preventDefault(); zone.classList.add("hot"); };
  zone.ondragleave = () => zone.classList.remove("hot");
  zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove("hot"); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); };
  input.onchange = () => { if (input.files.length) onFiles([...input.files]); input.value = ""; };
}
const isArchive = (n) => /\.(7z|zip)$/i.test(n);
function gauge(r, size = 72) {
  const v = Math.max(0, Math.min(100, +r || 0)), rad = 42, c = 2 * Math.PI * rad;
  const col = { hi: "var(--red)", mid: "var(--amber)", lo: "var(--green)" }[riskClass(v)];
  return `<div class="gauge" style="width:${size}px;height:${size}px" title="Risk ${v} of 100"><svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <circle cx="50" cy="50" r="${rad}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="50" cy="50" r="${rad}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}"/></svg>
    <div class="n" style="font-size:${Math.round(size * .3)}px;color:${col}">${v}</div></div>`;
}
const list = (arr, empty = "None") => arr && arr.length ? `<pre>${esc(arr.join("\n"))}</pre>` : `<div class="none">${empty}</div>`;
const sect = (title, open, inner) => `<details class="sect" ${open ? "open" : ""}><summary>${title}</summary><div>${inner}</div></details>`;
const timeOpts = (sel) => ["30", "60", "120", "180", "300"].map((t) => `<option value="${t}" ${t === sel ? "selected" : ""}>${t} s</option>`).join("");
const NET_OPTS = [["off", "Off"], ["sim", "Simulated"], ["inet", "Internet"], ["full", "Full"]];
const NET_HINT = { off: "No network inside the VM.", sim: "Fake DNS and HTTP inside the VM (FakeNet-NG). Nothing real leaves.",
  inet: "Internet only. Your LAN and this PC are blocked.", full: "Unrestricted, including your LAN." };
// Detonation request fields for a network mode.
const netBody = (net) => ({ networking: net !== "off", safe_net: net !== "full", simulate: net === "sim" });
const guardOn = () => !!(LAB && LAB.netguard && LAB.netguard.enabled);
const guardNote = () => guardOn() ? `<p>The host network guard is on: this PC's firewall blocks the sandbox's network from reaching this PC.</p>`
  : `<p style="color:var(--red)"><b>The host network guard is off.</b> The sandbox can reach services running on this PC. Turn it on in <a href="#/settings">Settings</a> first.</p>`;
async function netAsk(net) {
  if (net === "sim") {
    if (!(LAB && LAB.fakenet && LAB.fakenet.ready)) { toast("Simulated network needs FakeNet-NG in the lab's tools folder. See Settings > Analysis tools.", true); return false; }
    return ask({ title: "Run on a simulated network?", ok: "Run simulated", danger: !guardOn(),
      body: `<p>The VM gets a network adapter, but FakeNet-NG inside it answers every DNS lookup and connection with fake services, so the sample's requests are recorded and never reach the internet.</p>
        <p>FakeNet runs inside the VM, where the sample is administrator. If FakeNet stops, the monitor switches the VM's adapters off and the run is flagged, but a determined sample could get traffic out.</p>${guardNote()}` });
  }
  return ask({ title: net === "full" ? "Allow full network access?" : "Allow internet access?", ok: "Run with network", danger: true,
    body: `<p>The sample will be able to reach the internet, including real command-and-control servers, and those servers will see your public IP.</p><p>${net === "full" ? "<b>Your local network is not blocked.</b>" : "A firewall rule inside the VM blocks your local network and this PC, and the run is refused if it can't be applied. The sample runs as administrator inside the VM, so a determined sample could remove that rule."}</p>${guardNote()}` });
}

// Hardened interactive sandbox (header button + "Open in sandbox" on a sample page).
async function openSandbox(sampleId, name) {
  const ok = await ask({ title: sampleId ? `Open ${name} in Windows Sandbox?` : "Open Windows Sandbox?", ok: "Open sandbox",
    body: `<p>Starts a disposable Windows Sandbox with the lab's protections: <b>networking off</b>, no GPU sharing, and clipboard, audio, video and printer disconnected from this PC.</p>
      ${sampleId ? `<p>The sample is placed read-only in <span class="mono">Desktop\\input</span>. Running it there is your call. Nothing runs on this PC.</p>` : ""}
      <p>On logon the VM checks it can't see your GPU or reach a network, and powers itself off if it can. Everything is wiped when you close the window.</p>` });
  if (!ok) return;
  const r = await api("/api/lab/sandbox/open", sampleId ? { sample_id: sampleId } : {});
  if (r.error) return toast(r.error, true);
  toast("Windows Sandbox is starting…");
}

// ATT&CK matrix: techniques grouped by tactic.
const matrixHtml = (m) => !m || !m.length ? `<div class="none">No techniques observed yet.</div>` :
  `<div class="matrix">${m.map((col) => `<div class="mcol"><div class="mh">${esc(col.tactic)}</div>${col.techniques.map((t) =>
    `<a class="mt ${esc(t.severity)}" target="_blank" rel="noopener" href="https://attack.mitre.org/techniques/${esc(t.id.replace(".", "/"))}/" title="${esc(t.detections.join("\n"))}"><b>${esc(t.id)}</b>${esc(t.name)}</a>`).join("")}</div>`).join("")}</div>`;
const download = async (url, fallback) => {
  const r = await fetch(url); if (!r.ok) { const j = await r.json().catch(() => ({})); return toast(j.error || "Download failed", true); }
  const cd = r.headers.get("content-disposition") || "", m = cd.match(/filename="([^"]+)"/);
  const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = m ? m[1] : fallback; a.click(); URL.revokeObjectURL(a.href);
};
// Provider details -> short "key: value" strings (scalars and non-empty lists only).
const detailBits = (d) => Object.entries(d || {}).filter(([, v]) => Array.isArray(v) ? v.length : v != null && v !== "" && typeof v !== "object")
  .slice(0, 5).map(([k, v]) => `${k.replace(/_/g, " ")}: ${Array.isArray(v) ? v.slice(0, 6).join(", ") : v}`);
const verdictBadge = (v) => `<span class="badge ${v === "malicious" ? "malicious" : v === "suspicious" ? "suspicious" : v === "clean" ? "clean" : ""}">${esc(cap(v))}</span>`;

// ============================================================ state
let LAB = null;
let cur = {};
const OPTS = Object.assign({ exec: true, timeout: "60", net: "off", unpack: true }, store.get("opts", {}), { pw: "" });
const saveOpts = () => store.set("opts", { exec: OPTS.exec, timeout: OPTS.timeout, net: OPTS.net, unpack: OPTS.unpack });
const Q = { file: null, running: false, status: "", log: [], started: 0, done: null };
const DETONATING = {}, INTEL = {};
let UNPACK = null;      // {sid, archive, siblings} from the last quick run
let SAMPLE = null;      // data for the open sample page

async function refreshState() {
  const s = await api("/api/lab/state");
  if (s.error) return;
  LAB = s;
  const sb = LAB.sandbox || {};
  setStat("st-sb", sb.busy ? "busy" : sb.available ? "ok" : "bad", sb.busy ? "Sandbox busy" : sb.available ? "Sandbox" : "Sandbox off");
  const df = LAB.defender || {};
  setStat("st-def", !df.available ? "" : df.excluded ? "ok" : "warn",
    !df.available ? "Defender n/a" : df.excluded ? "Lab excluded" : "Defender scanning",
    !df.available ? "Microsoft Defender not detected" : df.excluded ? "The lab's sample folders are excluded from Defender" : "Defender may delete samples in the lab. Change this in Settings.");
  const ti = LAB.intel || [], on = ti.filter((p) => p.configured).length;
  setStat("st-ti", ti.some((p) => p.key_set) ? "ok" : "", `Intel ${on}/${ti.length}`);
  $("open-sb").disabled = !sb.available || sb.busy;
}
function setStat(id, cls, label, title) {
  const el = $(id); el.querySelector(".dot").className = "dot " + cls; el.querySelector(".lbl").textContent = label;
  el.title = title || label;
}

// ============================================================ router
function setNav(n) { document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === n)); }
function route() {
  const h = location.hash || "#/";
  let m;
  if ((m = h.match(/^#\/case\/([\w-]+)\/sample\/([\w-]+)(?:\/(\w+))?$/))) return viewSample(m[1], m[2], m[3] || "overview");
  if ((m = h.match(/^#\/case\/([\w-]+)$/))) return viewCase(m[1]);
  if ((m = h.match(/^#\/actor\/([\w-]+)$/))) return viewActor(m[1]);
  if (h === "#/actors") return viewActors();
  if (h === "#/cases") return viewCases();
  if (h === "#/rules") return viewRules();
  if (h === "#/settings") return viewSettings();
  return viewHome();
}
window.addEventListener("hashchange", route);
function page(html, keepScroll) {
  main.innerHTML = html;
  if (!keepScroll) { main.style.animation = "none"; void main.offsetWidth; main.style.animation = ""; window.scrollTo(0, 0); }
}
const loading = () => page(`<div class="empty"><span class="spin"></span></div>`);
function wireRows() { main.querySelectorAll("tr[data-href]").forEach((tr) => tr.onclick = () => location.hash = tr.dataset.href); }

// ============================================================ Analyze (home)
function viewHome() {
  setNav("analyze"); cur = { view: "home" };
  const sb = (LAB && LAB.sandbox) || {};
  const recent = ((LAB && LAB.cases) || []).slice().sort((a, b) => b.created - a.created).slice(0, 5);
  page(`
  <div class="page-head"><div><h1>Analyze a sample</h1>
    <p class="sub">Each file is quarantined and triaged, then run in a disposable, network-isolated Windows Sandbox that's wiped afterward. Nothing runs on this PC.</p></div></div>
  ${LAB && !sb.available ? `<div class="notice"><span class="nic">!</span><div class="grow"><b>Windows Sandbox is off.</b> Static analysis still works: switch off “Execute in sandbox” below.
    <details><summary>How to turn it on</summary><p>${esc(sb.message || "")}</p></details></div></div>` : ""}
  <div class="card">
    <div class="drop ${Q.file ? "has" : ""}" id="drop" tabindex="0" role="button" aria-label="Choose a file to analyze">
      <div class="ic">${ICON_UP}</div>
      <div class="t">Drop a file here or click to browse</div>
      <div class="file" id="drop-file">${Q.file ? esc(`${Q.file.name} · ${fmtSize(Q.file.size)}`) : '<span class="small" style="font-family:var(--sans)">Executables, documents, scripts, or a .zip / .7z archive</span>'}</div>
      <input type="file" id="file" hidden>
    </div>

// ============================================================ live events
function handle(e) {
  if (e.session !== "lab") return;
  switch (e.type) {
    case "lab_log":
      if (Q.running) { Q.log.push({ t: now(), text: e.text }); if (cur.view === "home") renderProgress(); }
      else if (e.error) {   // a background job (detonation, Sysmon download) failed before it could report
        toast(e.text, true);
        for (const k in DETONATING) delete DETONATING[k];
        if (cur.view === "sample") renderSample(true);
      }
      break;
    case "lab_quick_done": quickDone(e); break;
    case "lab_run_started": refreshState(); break;
    case "lab_run_done":
      if (Q.running) break;   // part of a quick run; quickDone handles it
      delete DETONATING[e.sample_id]; refreshState();
      toast("Detonation finished" + (e.verdict ? `: ${e.verdict}` : ""));
      if (cur.view === "sample" && cur.sid === e.sample_id) { SAMPLE.run = null; viewSample(cur.cid, cur.sid, cur.tab, true); }
      break;
    case "lab_sysmon": refreshState().then(() => { if (cur.view === "settings") viewSettings(); }); break;
    case "lab_tool_ready":
      delete TOOL_BUSY[e.tool];
      if (e.error) toast(e.text, true); else toast(`${TOOL_NAMES[e.tool] || e.tool} installed`);
      refreshState().then(() => { if (cur.view === "settings") viewSettings(); });
      break;
    case "lab_actors_imported":
      if (e.error) toast("Threat-group import failed: " + e.text, true);
      else toast(`Threat groups: ${e.created} added, ${e.updated} updated${e.errors && e.errors.length ? ` (${e.errors.length} source(s) failed)` : ""}`, !!(e.errors && e.errors.length));
      ACT_IMPORTING = false; refreshState(); if (cur.view === "actors") viewActors();
      break;
  }
}
// Theme: follows Windows' light/dark setting until the viewer picks one with the header button.
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme(store.get("theme", null));
async function start() {
  $("open-sb").onclick = () => openSandbox();
  $("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t);
  };
  loading();   // the first status call runs Defender / firewall checks and can take a few seconds
  await refreshState();
  if (LAB && !LAB.sandbox.available) OPTS.exec = false;   // nothing to detonate in; default to static analysis
  route();
  const es = new EventSource("/api/events");
  es.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch {} };
  setInterval(() => { if (!LAB || !LAB.sandbox.busy) refreshState(); }, 15000);
}
start();
</script>
